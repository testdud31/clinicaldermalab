<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CJ42JELK21"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-CJ42JELK21');
  </script>

  <!-- Search and Category Filtering Script with Deep Linking -->
  <script>
    function filterReviews(category, btn) {
      var pills = document.querySelectorAll('.category-pill');
      pills.forEach(function(p) { p.classList.remove('active'); });
      if (btn) {
        btn.classList.add('active');
      } else {
        var match = document.querySelector('.category-pill[data-filter="' + category + '"]');
        if (match) match.classList.add('active');
      }

      var articles = document.querySelectorAll('.review-item-card');
      articles.forEach(function(art) {
        var cats = (art.getAttribute('data-category') || '').toLowerCase().split(' ');
        var matches = false;
        if (category === 'all') {
          matches = true;
        } else if (category === 'acne') {
          matches = cats.includes('acne');
        } else if (category === 'rosacea') {
          matches = cats.includes('rosacea') || cats.includes('sensitive');
        } else if (category === 'barrier') {
          matches = cats.includes('barrier') || (cats.includes('moisturizer') && !cats.includes('tanning'));
        } else if (category === 'sunscreen') {
          matches = cats.includes('sunscreen');
        } else if (category === 'scalp') {
          matches = cats.includes('scalp') || cats.includes('dandruff');
        } else if (category === 'antiaging') {
          matches = cats.includes('antiaging') || cats.includes('serum') || cats.includes('pigment');
        } else if (category === 'maternity') {
          matches = cats.includes('maternity') || cats.includes('elasticity');
        } else {
          matches = cats.includes(category);
        }

        if (matches) {
          art.style.display = 'flex';
        } else {
          art.style.display = 'none';
        }
      });

      // Smooth scroll to results container if triggered via button click
      var filterBar = document.getElementById('filter-bar') || document.getElementById('reviews-container');
      if (btn && filterBar) {
        filterBar.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function searchReviews() {
      var query = document.getElementById('review-search').value.toLowerCase().trim();
      var articles = document.querySelectorAll('.review-item-card');
      articles.forEach(function(art) {
        var text = (art.getAttribute('data-title') || '') + ' ' + art.textContent.toLowerCase();
        if (!query || text.indexOf(query) !== -1) {
          art.style.display = 'flex';
        } else {
          art.style.display = 'none';
        }
      });
    }

    window.addEventListener('DOMContentLoaded', function() {
      var urlParams = new URLSearchParams(window.location.search);
      var initialFilter = urlParams.get('filter') || urlParams.get('category') || urlParams.get('condition');
      if (initialFilter) {
        filterReviews(initialFilter);
        var targetSection = document.getElementById('filter-bar') || document.getElementById('reviews-container');
        if (targetSection) {
          setTimeout(function() {
            targetSection.scrollIntoView({ behavior: 'smooth' });
          }, 150);
        }
      }
    });
  </script>

</body>
</html>
