<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2c3a" />
      <stop offset="100%" stop-color="#184459" />
    </linearGradient>
    <linearGradient id="logoCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon on Left -->
  <g transform="translate(0, 4)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#logoShieldGrad)"/>
    <rect x="1" y="1" width="38" height="38" rx="9" fill="none" stroke="#2a7f62" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Shield Outline -->
    <path d="M20 7 C26 7, 30 9, 31 13 C31 22, 26 30, 20 34 C14 30, 9 22, 9 13 C10 9, 14 7, 20 7 Z" 
          fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Medical Cross -->
    <path d="M17.5 15 H22.5 V19 H26.5 V24 H22.5 V28 H17.5 V24 H13.5 V19 H17.5 Z" 
          fill="url(#logoCrossGrad)"/>

    <!-- Micro Science Accents -->
    <circle cx="20" cy="12" r="1.4" fill="#a7f3d0" />
  </g>

  <!-- Wordmark Text on Right -->
  <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f2c3a" letter-spacing="-0.4">
    ClinicalDerma<tspan fill="#10b981">Lab</tspan>
  </text>
  <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="1.2">
    EVIDENCE-BASED DERMATOLOGY
  </text>
</svg>
