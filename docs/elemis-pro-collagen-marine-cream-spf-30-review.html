<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CJ42JELK21"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-CJ42JELK21');
  </script>

  <!-- Image Gallery Switcher & Query Parameter Auto-Scroll -->
  <script>
    function switchProductImg(btn, newSrc) {
      var mainImg = document.getElementById('main-product-img');
      if (mainImg) {
        mainImg.src = newSrc;
      }
      var allThumbs = document.querySelectorAll('.gallery-thumb-btn');
      allThumbs.forEach(function(t) {
        t.style.borderColor = 'var(--border)';
        t.classList.remove('active-thumb');
      });
      if (btn) {
        btn.style.borderColor = 'var(--accent-mushroom)';
        btn.classList.add('active-thumb');
      }
    }

    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.has('loya')) {
          var btn = document.querySelector('.amazon-affiliate-button');
          if (btn) {
            btn.click();
            setTimeout(function() {
              btn.scrollIntoView({ behavior: 'smooth' });
            }, 0);
          }
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
